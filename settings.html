<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>PengeluaranKu - Pengaturan</title>
  <link rel="stylesheet" href="/src/style.css" />
  <script>
    (function() {
      var hasSession = false;
      try {
        for (var i = 0; i < localStorage.length; i++) {
          var key = localStorage.key(i);
          if (key && key.indexOf('auth-token') !== -1) {
            var val = localStorage.getItem(key);
            if (val) {
              var data = JSON.parse(val);
              if (data && (data.access_token || data.user || data.currentSession)) {
                hasSession = true;
              }
            }
            break;
          }
        }
      } catch (e) {}
      
      var style = document.createElement('style');
      style.id = 'auth-preload-style';
      if (hasSession) {
        style.innerHTML = '#auth-container { display: none !important; } #app-wrapper { display: block !important; }';
      } else {
        style.innerHTML = '#app-wrapper { display: none !important; } #auth-container { display: flex !important; }';
      }
      document.head.appendChild(style);
    })();
  </script>
</head>
<body class="bg-gradient-to-b from-[#9ccfff] to-[#F5F5F7]/100 to-40%  min-h-screen bg-fixed bg-no-repeat text-gray-900 antialiased selection:bg-[#2896FF] selection:text-white">

  <!-- Page Loader Overlay -->
  <div id="page-loader" class="fixed inset-0 z-[9999] flex items-center justify-center bg-[#F5F5F7]/80 backdrop-blur-md transition-opacity duration-300">
    <div class="flex flex-col items-center gap-4">
      <div class="w-10 h-10 rounded-full border-4 border-slate-200 border-t-[#2896FF] animate-spin"></div>
      <p class="text-xs font-semibold text-slate-400 tracking-widest animate-pulse">Memuat...</p>
    </div>
  </div>

  <!-- ========================================== -->
  <!-- HALAMAN AUTENTIKASI (LOGIN / REGISTER)     -->
  <!-- ========================================== -->
  <div id="auth-container" class="min-h-screen flex flex-col justify-end sm:justify-center items-center transition-all relative">
    
    <div class="absolute top-0 left-0 w-full h-[65vh] sm:h-full z-0 overflow-hidden pointer-events-none bg-[#2896FF]">
      <img src="src/assets/home5.png" class="w-full h-full object-cover grayscale contrast-125 opacity-60 mix-blend-multiply">
      <div class="absolute inset-0 bg-gradient-to-t from-white via-white/60 to-transparent"></div>
    </div>

    <div class="w-full max-w-[400px] px-6 pb-6 relative z-10 sm:hidden">
      <div>
        <h2 class="text-3xl font-black text-slate-900 leading-tight">Solusi Cerdas Kelola Keuangan</h2>
        <p class="text-base text-slate-700 mt-1 font-bold">Catat, pantau, dan kendalikan pengeluaranmu.</p>
      </div>
    </div>

    <div class="bg-white rounded-t-[2.5rem] sm:rounded-[2rem] p-6 sm:p-8 pb-10 sm:pb-8 shadow-[0_-8px_30px_rgb(0,0,0,0.04)] sm:shadow-[0_8px_30px_rgb(0,0,0,0.04)] w-full max-w-[400px] border-t sm:border border-black/5 animate-fade-in relative z-10 overflow-hidden">
      
      <div class="w-12 h-1.5 bg-gray-200 rounded-full mx-auto mb-6 sm:hidden"></div>
      <div class="absolute -top-20 -right-20 w-40 h-40 bg-gradient-to-br from-[#55E1FF] to-[#2896FF] rounded-full blur-3xl opacity-10 pointer-events-none"></div>

      <div class="flex items-center justify-center gap-3 mb-6 relative z-10">
        <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-[#55E1FF] to-[#2896FF] flex items-center justify-center text-white shadow-[0_4px_12px_rgba(40,150,255,0.3)]">
          <i data-lucide="wallet" class="w-6 h-6"></i>
        </div>
        <h1 class="text-2xl font-bold tracking-tight text-slate-800">PengeluaranKu</h1>
      </div>

      <div class="relative flex bg-gray-100/80 rounded-2xl p-1 mb-6 border border-black/5 z-10">
        <div id="auth-slider-bg" class="absolute top-1 bottom-1 left-1 w-[calc(50%-4px)] bg-white rounded-xl shadow-[0_2px_8px_rgb(0,0,0,0.08)] transition-transform duration-300 ease-in-out transform translate-x-0"></div>
        <button id="btn-mode-login" class="relative z-10 w-1/2 py-2.5 text-sm font-bold text-slate-900 transition-colors cursor-pointer">Masuk</button>
        <button id="btn-mode-register" class="relative z-10 w-1/2 py-2.5 text-sm font-bold text-gray-400 transition-colors cursor-pointer">Daftar</button>
      </div>

      <!-- Kotak Pesan Error -->
      <div id="auth-error-box" class="hidden mb-4 p-3 bg-red-50 border border-red-100 rounded-xl flex items-center gap-2 animate-fade-in relative z-10">
        <i data-lucide="alert-circle" class="w-5 h-5 text-red-500 flex-shrink-0"></i>
        <p id="auth-error-text" class="text-sm text-red-600 font-medium"></p>
      </div>

      <!-- Kotak Pesan Sukses -->
      <div id="auth-success-box" class="hidden mb-4 p-3 bg-green-50 border border-green-100 rounded-xl flex items-center gap-2 animate-fade-in relative z-10">
        <i data-lucide="check-circle" class="w-5 h-5 text-green-500 flex-shrink-0"></i>
        <p id="auth-success-text" class="text-sm text-green-600 font-medium"></p>
      </div>

      <form id="auth-form" class="space-y-4 relative z-10">
        <div id="auth-name-container" class="relative hidden">
          <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
            <i data-lucide="user" class="w-5 h-5 text-slate-400"></i>
          </div>
          <input type="text" id="auth-name" placeholder="Nama Panggilan" class="w-full bg-slate-50 rounded-2xl pl-11 pr-4 py-3.5 outline-none focus:bg-white focus:ring-2 focus:ring-[#2896FF] transition-all font-medium text-sm border border-transparent focus:border-[#2896FF]/20 text-slate-700 placeholder-slate-400">
        </div>

        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
            <i data-lucide="mail" class="w-5 h-5 text-slate-400"></i>
          </div>
          <input type="email" id="auth-email" required placeholder="Alamat Email" class="w-full bg-slate-50 rounded-2xl pl-11 pr-4 py-3.5 outline-none focus:bg-white focus:ring-2 focus:ring-[#2896FF] transition-all font-medium text-sm border border-transparent focus:border-[#2896FF]/20 text-slate-700 placeholder-slate-400">
        </div>
        
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
            <i data-lucide="lock" class="w-5 h-5 text-slate-400"></i>
          </div>
          <input type="password" id="auth-password" required placeholder="Kata Sandi" class="w-full bg-slate-50 rounded-2xl pl-11 pr-12 py-3.5 outline-none focus:bg-white focus:ring-2 focus:ring-[#2896FF] transition-all font-medium text-sm border border-transparent focus:border-[#2896FF]/20 text-slate-700 placeholder-slate-400">
          
          <button type="button" id="toggle-password" class="absolute inset-y-0 right-0 pr-4 flex items-center text-slate-400 hover:text-slate-600 focus:outline-none transition-colors">
            <i data-lucide="eye" id="eye-icon" class="w-5 h-5"></i>
          </button>
        </div>

        <button type="submit" id="auth-submit-btn" class="w-full bg-gradient-to-b from-[#55E1FF] to-[#2896FF] text-white rounded-2xl px-4 py-4 font-bold mt-10 hover:opacity-90 active:scale-[0.98] transition-all shadow-[0_4px_12px_rgba(40,150,255,0.3)] flex justify-center items-center gap-2">
          <span>Masuk</span>
        </button>
      </form>
    </div>
  </div>

  <!-- ========================================== -->
  <!-- APLIKASI UTAMA                             -->
  <!-- ========================================== -->
  <div id="app-wrapper" class="hidden relative">
    <div id="app-container" class="max-w-md mx-auto md:max-w-5xl md:flex md:gap-12 pb-16 md:pb-6 pt-8 px-4 md:px-8 min-h-screen">

      <div class="absolute top-0 left-0 w-full h-[45vh] sm:h-[50vh] z-0 pointer-events-none select-none"
          style="-webkit-mask-image: linear-gradient(to bottom, black 50%, transparent 100%); mask-image: linear-gradient(to bottom, black 50%, transparent 100%);">
        <div class="w-full h-full bg-gradient-to-br from-[#76b4ff]/50 to-[#2896FF]/20">
          <img src="src/assets/home.jpg" alt="App Background" class="w-full h-full object-cover opacity-15 mix-blend-multiply">
        </div>
      </div>

      <div id="app-container" class="relative z-10 max-w-md mx-auto md:max-w-5xl md:flex md:gap-8 pb-16 md:pb-6 pt-8 px-4 md:px-8 min-h-screen">      

      <!-- Gradient Blur di Belakang Navbar (Mobile Only) -->
      <div class="md:hidden fixed bottom-0 left-0 right-0 h-32 pointer-events-none z-40 bg-gradient-to-t from-white/20 to-transparent"
           style="backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); -webkit-mask-image: linear-gradient(to top, black 30%, transparent 100%); mask-image: linear-gradient(to top, black 30%, transparent 100%);">
      </div>

      <!-- Navigasi -->
      <nav class="fixed bottom-4 left-4 right-4 backdrop-blur-xl bg-white/90 flex justify-evenly items-center p-2 pb-[calc(0.5rem+env(safe-area-inset-bottom))] z-50 md:sticky md:top-8 md:self-start md:w-64 md:flex-col md:justify-start md:gap-4 md:rounded-[2rem] md:shadow-[0_8px_30px_rgb(0,0,0,0.04)] md:h-fit md:p-6 transition-all border border-black/10 md:border will-change-transform rounded-[1.75rem] shadow-[0_8px_30px_rgba(0,0,0,0.06)]">
        <div class="hidden md:flex flex-col mb-8 w-full">
          <div class="flex items-center gap-3 mb-1">
            <div id="desktop-avatar-container" class="w-8 h-8 rounded-full border-2 border-white bg-gradient-to-br from-[#55E1FF] to-[#2896FF] flex items-center justify-center text-white shadow-[0_4px_10px_rgba(40,150,255,0.3)] overflow-hidden">
              <i data-lucide="wallet" id="desktop-avatar-icon" class="w-4 h-4"></i>
              <img id="desktop-avatar-img" src="" class="hidden w-full h-full object-cover">
            </div>
            <h1 class="text-lg font-bold tracking-tight text-slate-800">Tracker</h1>
          </div>
          <p id="greeting-text-desktop" class="text-xs font-bold text-slate-400 mt-1 truncate">Halo, ...</p>
        </div>
        
        <a href="/index.html" class="nav-link flex-1 md:flex-none flex flex-col md:flex-row items-center justify-center md:justify-start gap-1 md:gap-4 h-[56px] md:w-full md:h-auto rounded-2xl text-gray-500 hover:bg-black/5 hover:text-gray-900 transition-all text-[11px] md:text-sm font-bold md:p-3">
          <i data-lucide="Home" class="w-[22px] h-[22px] md:w-5 md:h-5"></i>
          <span>Beranda</span>
        </a>

        <a href="/input.html" class="nav-link flex-1 md:flex-none flex flex-col md:flex-row items-center justify-center md:justify-start gap-1 md:gap-4 h-[56px] md:w-full md:h-auto rounded-2xl text-gray-500 hover:bg-black/5 hover:text-gray-900 transition-all text-[11px] md:text-sm font-bold md:p-3">
          <i data-lucide="plus-circle" class="w-[22px] h-[22px] md:w-5 md:h-5"></i>
          <span>Input</span>
        </a>

        <!-- Tombol Pengaturan -->
        <div class="flex-1 md:flex-none md:mt-auto md:w-full pt-0 md:pt-4 md:border-t border-black/5">
          <a href="/settings.html" class="nav-link flex flex-col md:flex-row items-center justify-center md:justify-start gap-1 md:gap-4 w-full h-[56px] md:h-auto rounded-2xl text-gray-500 hover:bg-black/5 hover:text-gray-900 transition-all text-[11px] md:text-sm font-bold md:p-3">
            <i data-lucide="settings" class="w-[22px] h-[22px] md:w-5 md:h-5"></i>
            <span>Pengaturan</span>
          </a>
        </div>
      </nav>

      <!-- App Content Container -->
      <main class="flex-1 w-full" id="app-content">

        <!-- HALAMAN 3: PENGATURAN -->
        <section id="page-settings" class="page-section animate-fade-in">
          
          <div class="mb-6">
            <h2 class="text-2xl sm:text-3xl font-bold tracking-tight text-slate-800">Profil Saya</h2>
          </div>

          <div class="bg-white rounded-3xl p-6 sm:p-8 shadow-[0_8px_30px_rgb(0,0,0,0.04)] mb-0 border border-black/5 flex flex-col items-center">
            
            <!-- ============================== -->
            <!-- MODE LIHAT PROFIL (VIEW)       -->
            <!-- ============================== -->
            <div id="profile-view-mode" class="w-full flex flex-col items-center animate-fade-in">
              
              <!-- 1. Area Header (Foto, Nama, Email) -->
              <div class="w-full flex flex-col items-center relative mb-8">
                <!-- Aksen Glow di Belakang Avatar -->
                <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-32 h-32 bg-[#2896FF]/20 rounded-full blur-2xl pointer-events-none"></div>
                
                <div class="relative w-24 h-24 sm:w-28 sm:h-28 rounded-full shadow-md border-[4px] border-white mx-auto mb-4 bg-slate-50 ring-1 ring-black/5 z-10">
                  <img id="display-profile-avatar" src="https://api.dicebear.com/8.x/dylan/svg?seed=Felix&backgroundColor=transparent" alt="Avatar" class="w-full h-full object-cover rounded-full">
                </div>

                <h3 id="display-profile-name" class="text-2xl sm:text-3xl font-bold text-[#1E293B] tracking-tight relative z-10">Memuat...</h3>
                <p id="display-profile-email" class="text-sm font-medium text-slate-500 mt-1 relative z-10">memuat@email.com</p>
                
                <!-- Tombol Edit Profil (Kecil di bawah nama) -->
                <button id="btn-edit-profile-mode" class="mt-4 px-6 py-2 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-full text-sm font-bold transition-all active:scale-95 flex items-center justify-center gap-2 relative z-10">
                  <i data-lucide="pencil" class="w-3.5 h-3.5"></i>
                  <span>Edit Profil</span>
                </button>
              </div>

              <!-- 2. Statistik Aktivitas User (Quick Stats) -->
              <div class="grid grid-cols-2 gap-3 sm:gap-4 w-full mb-8">
                <div class="bg-slate-50 rounded-2xl p-4 border border-black/5 text-center">
                  <div class="w-8 h-8 rounded-full bg-[#2896FF]/10 text-[#2896FF] flex items-center justify-center mx-auto mb-2">
                    <i data-lucide="calendar-check" class="w-4 h-4"></i>
                  </div>
                  <p class="text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-0.5">Hari Aktif</p>
                  <h4 class="text-xl font-bold text-slate-800" id="stat-active-days">0</h4>
                </div>
                <div class="bg-slate-50 rounded-2xl p-4 border border-black/5 text-center">
                  <div class="w-8 h-8 rounded-full bg-orange-500/10 text-orange-500 flex items-center justify-center mx-auto mb-2">
                    <i data-lucide="receipt" class="w-4 h-4"></i>
                  </div>
                  <p class="text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-0.5">Total Catatan</p>
                  <h4 class="text-xl font-bold text-slate-800" id="stat-total-entries">0</h4>
                </div>
              </div>

              <!-- 3. List Menu Pengaturan -->
              <div class="w-full space-y-2 mb-8">
                <h4 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3 px-2">Pengaturan Akun</h4>
                
                <!-- Menu Keamanan -->
                <button class="w-full flex items-center justify-between p-4 bg-white hover:bg-slate-50 border border-transparent hover:border-black/5 rounded-2xl transition-colors group cursor-pointer">
                  <div class="flex items-center gap-4">
                    <div class="w-10 h-10 rounded-xl bg-slate-100 flex items-center justify-center text-slate-500 group-hover:text-[#2896FF] group-hover:bg-[#2896FF]/10 transition-colors">
                      <i data-lucide="shield" class="w-5 h-5"></i>
                    </div>
                    <span class="font-bold text-slate-700">Keamanan & Sandi</span>
                  </div>
                  <i data-lucide="chevron-right" class="w-5 h-5 text-slate-300 group-hover:text-slate-500 transition-colors"></i>
                </button>

                <!-- Menu Preferensi -->
                <button class="w-full flex items-center justify-between p-4 bg-white hover:bg-slate-50 border border-transparent hover:border-black/5 rounded-2xl transition-colors group cursor-pointer">
                  <div class="flex items-center gap-4">
                    <div class="w-10 h-10 rounded-xl bg-slate-100 flex items-center justify-center text-slate-500 group-hover:text-[#2896FF] group-hover:bg-[#2896FF]/10 transition-colors">
                      <i data-lucide="settings-2" class="w-5 h-5"></i>
                    </div>
                    <span class="font-bold text-slate-700">Preferensi Aplikasi</span>
                  </div>
                  <i data-lucide="chevron-right" class="w-5 h-5 text-slate-300 group-hover:text-slate-500 transition-colors"></i>
                </button>

                <!-- Menu Bantuan -->
                <button class="w-full flex items-center justify-between p-4 bg-white hover:bg-slate-50 border border-transparent hover:border-black/5 rounded-2xl transition-colors group cursor-pointer">
                  <div class="flex items-center gap-4">
                    <div class="w-10 h-10 rounded-xl bg-slate-100 flex items-center justify-center text-slate-500 group-hover:text-[#2896FF] group-hover:bg-[#2896FF]/10 transition-colors">
                      <i data-lucide="help-circle" class="w-5 h-5"></i>
                    </div>
                    <span class="font-bold text-slate-700">Pusat Bantuan</span>
                  </div>
                  <i data-lucide="chevron-right" class="w-5 h-5 text-slate-300 group-hover:text-slate-500 transition-colors"></i>
                </button>
              </div>

              <hr class="border-black/5 mb-6 w-full">

              <!-- Tombol Keluar -->
              <button id="btn-logout" class="w-full flex items-center justify-center gap-2 bg-red-50 text-red-500 rounded-2xl px-4 py-3.5 font-bold hover:bg-red-100 active:scale-[0.98] transition-all border border-red-100">
                <i data-lucide="log-out" class="w-5 h-5"></i>
                <span>Keluar dari Akun</span>
              </button>
            </div>

            <!-- ============================== -->
            <!-- MODE EDIT PROFIL (FORM)        -->
            <!-- ============================== -->
            <form id="profile-form" class="hidden space-y-6 animate-fade-in w-full">
              
              <!-- Header Form Edit -->
              <div class="flex items-center gap-3 mb-6 pb-4 border-b border-black/5">
                 <button type="button" id="btn-cancel-edit" class="p-2 -ml-2 text-slate-400 hover:bg-slate-100 hover:text-slate-600 rounded-full transition-colors active:scale-95 flex items-center justify-center">
                   <i data-lucide="arrow-left" class="w-5 h-5"></i>
                 </button>
                 <h3 class="text-lg font-bold text-slate-800">Edit Profil</h3>
              </div>

              <!-- Pilihan Avatar -->
              <div>
                <label class="block text-sm font-bold text-slate-700 mb-3">Pilih Avatar Baru</label>
                <div class="flex gap-3 overflow-x-auto pb-3 hide-scrollbar" id="avatar-selection">
                  <button type="button" class="avatar-btn flex-shrink-0 relative w-16 h-16 rounded-full border-[3px] border-transparent hover:border-[#2896FF]/50 focus:border-[#2896FF] transition-all overflow-hidden bg-slate-100 shadow-sm" data-avatar="1">
                    <img src="https://api.dicebear.com/9.x/dylan/svg?seed=Felix&backgroundColor=transparent" alt="Avatar 1" class="w-full h-full object-cover">
                  </button>
                  <button type="button" class="avatar-btn flex-shrink-0 relative w-16 h-16 rounded-full border-[3px] border-transparent hover:border-[#2896FF]/50 focus:border-[#2896FF] transition-all overflow-hidden bg-yellow-100 shadow-sm" data-avatar="2">
                    <img src="https://api.dicebear.com/9.x/dylan/svg?seed=Aneka&backgroundColor=transparent" alt="Avatar 2" class="w-full h-full object-cover">
                  </button>
                  <button type="button" class="avatar-btn flex-shrink-0 relative w-16 h-16 rounded-full border-[3px] border-transparent hover:border-[#2896FF]/50 focus:border-[#2896FF] transition-all overflow-hidden bg-red-100 shadow-sm" data-avatar="3">
                    <img src="https://api.dicebear.com/9.x/dylan/svg?seed=Mimi&backgroundColor=transparent" alt="Avatar 3" class="w-full h-full object-cover">
                  </button>
                  <button type="button" class="avatar-btn flex-shrink-0 relative w-16 h-16 rounded-full border-[3px] border-transparent hover:border-[#2896FF]/50 focus:border-[#2896FF] transition-all overflow-hidden bg-green-100 shadow-sm" data-avatar="4">
                    <img src="https://api.dicebear.com/9.x/dylan/svg?seed=Brooklyn&backgroundColor=transparent" alt="Avatar 4" class="w-full h-full object-cover">
                  </button>
                  <button type="button" class="avatar-btn flex-shrink-0 relative w-16 h-16 rounded-full border-[3px] border-transparent hover:border-[#2896FF]/50 focus:border-[#2896FF] transition-all overflow-hidden bg-blue-100 shadow-sm" data-avatar="5">
                    <img src="https://api.dicebear.com/9.x/dylan/svg?seed=Brian&backgroundColor=transparent" alt="Avatar 5" class="w-full h-full object-cover">
                  </button>
                </div>
              </div>

              <!-- Nama Panggilan -->
              <div>
                <label for="profile-name" class="block text-sm font-bold text-slate-700 mb-2">Nama Panggilan</label>
                <div class="relative">
                  <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                    <i data-lucide="user" class="w-5 h-5 text-slate-400"></i>
                  </div>
                  <input type="text" id="profile-name" required placeholder="Nama Anda" class="w-full bg-gray-100 rounded-2xl pl-11 pr-4 py-3.5 outline-none focus:ring-2 focus:ring-[#2896FF] transition-shadow placeholder-gray-400 font-medium text-sm sm:text-base">
                </div>
              </div>

              <!-- Tombol Simpan -->
              <button type="submit" id="btn-save-profile" class="w-full bg-gradient-to-b from-[#55E1FF] to-[#2896FF] text-white rounded-2xl px-4 py-3.5 font-bold hover:opacity-90 active:scale-[0.98] transition-all shadow-[0_4px_12px_rgba(40,150,255,0.3)] mt-2">
                <span>Simpan Perubahan</span>
              </button>
            </form>

          </div>
        </section>

      </main>
    </div>

  </div> 

  <script type="module" src="/src/settings.js"></script>
</body>
</html>
